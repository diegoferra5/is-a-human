<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>is-a-human · paquete de gráficas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
  :root{
    --ground:#F7F8FA;--surface:#FFFFFF;--ink:#111720;--ink-soft:#38424F;
    --muted:#6B7686;--line:#DFE3EA;--accent:#0E6E6E;--accent-soft:#E4F0EF;
    --human:#1B6E4B;--synth:#B3352C;
    --serif:"Source Serif 4", Georgia, serif;
    --sans:"Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
    --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  }
  *{box-sizing:border-box}
  body{background:var(--ground);color:var(--ink);font-family:var(--serif);margin:0;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
  header{max-width:1100px;margin:0 auto;padding:40px 24px 20px}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
  h1{font-family:var(--sans);font-weight:800;font-size:clamp(32px,5vw,48px);letter-spacing:-.025em;margin:0 0 10px}
  .lede{color:var(--ink-soft);max-width:62ch;margin:0}
  .lede a{color:var(--accent)}
  nav{display:flex;flex-wrap:wrap;gap:8px 14px;max-width:1100px;margin:0 auto;padding:0 24px 28px;border-bottom:1px solid var(--line)}
  nav a{font-family:var(--mono);font-size:12px;color:var(--accent);text-decoration:none}
  main{max-width:1100px;margin:0 auto;padding:28px 24px 80px;display:grid;gap:18px}
  @media(min-width:860px){main{grid-template-columns:1fr 1fr}}
  .fig{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:20px 20px 16px;break-inside:avoid}
  .fig.wide{grid-column:1 / -1}
  .fig h2{font-family:var(--sans);font-weight:600;font-size:18px;letter-spacing:-.014em;margin:0 0 14px}
  .bars{display:flex;flex-direction:column;gap:9px}
  .br{display:grid;grid-template-columns:minmax(100px,38%) 1fr 54px;gap:8px;align-items:center}
  .br span:first-child{font-family:var(--mono);font-size:11.5px;color:var(--ink-soft)}
  .br span:last-child{font-family:var(--mono);font-size:12px;text-align:right;font-variant-numeric:tabular-nums}
  .track{height:10px;background:#ECEEF2;border-radius:99px;overflow:hidden}
  .f{height:100%;border-radius:99px}
  .f.h{background:var(--human)} .f.s{background:var(--synth)} .f.a{background:var(--accent)} .f.m{background:#9AA3B0}
  .src{font-family:var(--mono);font-size:11px;color:var(--muted);margin:10px 0 0}
  .note{font-size:14.5px;color:var(--ink-soft);margin:0 0 12px}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th,td{text-align:left;padding:6px 8px 6px 0;border-bottom:1px solid var(--line);vertical-align:top}
  th{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
  .mono{font-family:var(--mono);font-size:12px}
  .pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;height:130px;align-items:end}
  .col{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
  .stack{width:50%;display:flex;flex-direction:column-reverse;border-radius:4px 4px 0 0;overflow:hidden}
  .col label{font-family:var(--mono);font-size:11px;color:var(--muted)}
  .legend{display:flex;gap:14px;margin-top:8px;font-family:var(--mono);font-size:11px;color:var(--muted)}
  .legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}
  .dots{display:flex;flex-wrap:wrap;gap:6px}
  .dot{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-radius:3px;padding:3px 7px;color:var(--ink-soft)}
  .dot.keep{border-color:#BEDCDA;background:var(--accent-soft);color:var(--accent)}
  .dot.drop{color:var(--muted)}
  @media print{
    header,nav{break-after:avoid}
    .fig{break-inside:avoid;page-break-inside:avoid}
    body{background:#fff}
  }
</style>
</head>
<body>
<header>
  <p class="eyebrow">Paquete para captura / impresión</p>
  <h1>Gráficas para la presentación</h1>
  <p class="lede">Español · <a href="charts.html">EN</a>. Una figura por tarjeta. Captura o imprime. Diapositivas: <a href="presentacion.html">presentacion.html</a> · guía: <a href="guia-jueces.html">guia-jueces.html</a>.</p>
</header>
<nav>
  <a href="#data">Datos</a>
  <a href="#audio">Audio / VAD</a>
  <a href="#signals">Señales</a>
  <a href="#model">Modelo</a>

  <a href="#ops">Latencia</a>
</nav>
<main>

<figure class="fig" id="data">
  <h2>Mezcla del conjunto · 353 llamadas</h2>
  <div class="bars">
    <div class="br"><span>Humano</span><div class="track"><div class="f h" style="width:42.5%"></div></div><span>150</span></div>
    <div class="br"><span>Sintético</span><div class="track"><div class="f s" style="width:57.5%"></div></div><span>203</span></div>
  </div>
  <p class="src">Español mexicano · media ~148 s · 14.5 horas · pila ASR+LLM+TTS, no reproducción</p>
</figure>

<figure class="fig">
  <h2>Train vs val, apilado por clase</h2>
  <div class="pair">
    <div class="col">
      <div class="stack" style="height:100%">
        <div style="height:40%;background:var(--human)"></div>
        <div style="height:60%;background:var(--synth)"></div>
      </div>
      <label>Train 282</label>
    </div>
    <div class="col">
      <div class="stack" style="height:25%">
        <div style="height:52%;background:var(--human)"></div>
        <div style="height:48%;background:var(--synth)"></div>
      </div>
      <label>Val 71</label>
    </div>
  </div>
  <div class="legend"><span><i style="background:var(--human)"></i>Humano 113 / 37</span><span><i style="background:var(--synth)"></i>Sintético 169 / 34</span></div>
  <p class="src">Hablantes disjuntos. El set oculto es un tercer grupo de hablantes y voces.</p>
</figure>

<figure class="fig">
  <h2>Duración de la llamada (segundos)</h2>
  <div class="bars">
    <div class="br"><span>Más corta</span><div class="track"><div class="f m" style="width:22%"></div></div><span>61</span></div>
    <div class="br"><span>Media</span><div class="track"><div class="f a" style="width:54%"></div></div><span>148</span></div>
    <div class="br"><span>Más larga</span><div class="track"><div class="f m" style="width:100%"></div></div><span>273</span></div>
  </div>
  <p class="src">Llamada típica ~2.5 minutos. La puntuación son 22 ms encima de eso.</p>
</figure>

<figure class="fig">
  <h2>Disposición estéreo</h2>
  <svg viewBox="0 0 640 130" width="100%" height="130">
    <text x="0" y="14" fill="#6B7686" font-size="12" font-family="IBM Plex Mono, monospace">ch0 llamante</text>
    <rect x="0" y="22" width="640" height="32" fill="#ECEEF2" rx="4"/>
    <rect x="40" y="27" width="80" height="22" fill="#0E6E6E" rx="3"/>
    <rect x="200" y="27" width="100" height="22" fill="#0E6E6E" rx="3"/>
    <rect x="480" y="27" width="70" height="22" fill="#0E6E6E" rx="3"/>
    <text x="0" y="78" fill="#6B7686" font-size="12" font-family="IBM Plex Mono, monospace">ch1 agente</text>
    <rect x="0" y="86" width="640" height="32" fill="#ECEEF2" rx="4"/>
    <rect x="0" y="91" width="140" height="22" fill="#9AA3B0" rx="3"/>
    <rect x="300" y="91" width="160" height="22" fill="#9AA3B0" rx="3"/>
  </svg>
  <p class="src">8 kHz · PCM de 16 bits · solo clasificamos el canal 0</p>
</figure>

<figure class="fig wide" id="audio">
  <h2>Traslape de VAD vs turnos de los organizadores (IoU en val)</h2>
  <div class="bars">
    <div class="br"><span>Silero neural</span><div class="track"><div class="f m" style="width:87.6%"></div></div><span>0.876</span></div>
    <div class="br"><span>Energía 6 dB</span><div class="track"><div class="f m" style="width:80.7%"></div></div><span>0.807</span></div>
    <div class="br"><span>AND hybrid viejo</span><div class="track"><div class="f m" style="width:89.1%"></div></div><span>0.891</span></div>
    <div class="br"><span>Hybrid ajustado</span><div class="track"><div class="f a" style="width:97.9%"></div></div><span>0.979</span></div>
  </div>
  <p class="src">No es acierto humano-vs-sintético. Energía ajustada: 14 dB / piso del percentil 12 / 120 ms / 280 ms · ~9 ms</p>
</figure>

<figure class="fig">
  <h2>IoU llamante vs agente (hybrid ajustado)</h2>
  <div class="bars">
    <div class="br"><span>Llamante</span><div class="track"><div class="f a" style="width:97.2%"></div></div><span>0.972</span></div>
    <div class="br"><span>Agente</span><div class="track"><div class="f h" style="width:98.7%"></div></div><span>0.987</span></div>
    <div class="br"><span>Silero llamante</span><div class="track"><div class="f m" style="width:81.1%"></div></div><span>0.811</span></div>
    <div class="br"><span>Silero agente</span><div class="track"><div class="f m" style="width:94.1%"></div></div><span>0.941</span></div>
  </div>
  <p class="src">El canal del agente está limpio; el llamante es ruidoso. La energía recuperó el lado ruidoso.</p>
</figure>

<figure class="fig">
  <h2>Meseta del umbral de energía (IoU en train)</h2>
  <div class="bars">
    <div class="br"><span>6 dB</span><div class="track"><div class="f m" style="width:80%"></div></div><span>0.80</span></div>
    <div class="br"><span>10 dB</span><div class="track"><div class="f a" style="width:93%"></div></div><span>0.93</span></div>
    <div class="br"><span>14 dB en producción</span><div class="track"><div class="f h" style="width:95%"></div></div><span>0.95</span></div>
    <div class="br"><span>16 dB</span><div class="track"><div class="f a" style="width:94%"></div></div><span>0.94</span></div>
  </div>
  <p class="src">13–15 dB está en una meseta. No es un pico de una sola llamada. El mismo patrón en val.</p>
</figure>

<figure class="fig" id="signals">
  <h2>Espera mediana después de que el agente se calla</h2>
  <div class="bars">
    <div class="br"><span>Humano</span><div class="track"><div class="f h" style="width:48%"></div></div><span>1.22 s</span></div>
    <div class="br"><span>Sintético</span><div class="track"><div class="f s" style="width:100%"></div></div><span>2.56 s</span></div>
  </div>
  <p class="src">caller_response_latency_pos_median_s · val · d ≈ +1.90 train</p>
</figure>

<figure class="fig">
  <h2>Irregularidad de volumen (rms_cv)</h2>
  <div class="bars">
    <div class="br"><span>Humano</span><div class="track"><div class="f h" style="width:100%"></div></div><span>0.64</span></div>
    <div class="br"><span>Sintético</span><div class="track"><div class="f s" style="width:39%"></div></div><span>0.25</span></div>
  </div>
  <p class="src">Rasgo acústico que enviamos. Más alto = el volumen se mueve más.</p>
</figure>

<figure class="fig">
  <h2>Trampa del volumen promedio (rms_mean)</h2>
  <div class="bars">
    <div class="br"><span>Humano</span><div class="track"><div class="f h" style="width:46%"></div></div><span>0.07</span></div>
    <div class="br"><span>Sintético</span><div class="track"><div class="f s" style="width:100%"></div></div><span>0.15</span></div>
  </div>
  <p class="src">Medias de train. El separador más fuerte del zip — lo tiramos como artefacto de inyección.</p>
</figure>

<figure class="fig">
  <h2>Variación de zumbido (zcr_std)</h2>
  <div class="bars">
    <div class="br"><span>Humano</span><div class="track"><div class="f h" style="width:100%"></div></div><span>0.070</span></div>
    <div class="br"><span>Sintético</span><div class="track"><div class="f s" style="width:46%"></div></div><span>0.032</span></div>
  </div>
  <p class="src">Medias de train ±. Desv. de tasa de cruces por cero. d = −1.37 train / −1.81 val</p>
</figure>

<figure class="fig wide">
  <h2>Pistas que enviamos · |d de Cohen| en train</h2>
  <div class="bars">
    <div class="br"><span>Espera tras el agente</span><div class="track"><div class="f a" style="width:100%"></div></div><span>1.90</span></div>
    <div class="br"><span>spectral_flatness std</span><div class="track"><div class="f a" style="width:77%"></div></div><span>1.46</span></div>
    <div class="br"><span>std de brillo</span><div class="track"><div class="f a" style="width:77%"></div></div><span>1.46</span></div>
    <div class="br"><span>rms_cv</span><div class="track"><div class="f a" style="width:76%"></div></div><span>1.44</span></div>
    <div class="br"><span>zcr_std</span><div class="track"><div class="f a" style="width:74%"></div></div><span>1.41</span></div>
    <div class="br"><span>agent_talk_ratio</span><div class="track"><div class="f a" style="width:70%"></div></div><span>1.32</span></div>
    <div class="br"><span>recovery_cv</span><div class="track"><div class="f a" style="width:69%"></div></div><span>1.31</span></div>
    <div class="br"><span>crest_factor CV</span><div class="track"><div class="f a" style="width:64%"></div></div><span>1.22</span></div>
  </div>
  <p class="src">0.8 es un efecto grande. La espera es más alta para sintéticos; el resto es más alto para humanos.</p>
</figure>

<figure class="fig">
  <h2>Ideas que sacaron cero</h2>
  <div class="bars">
    <div class="br"><span>Tasa de eventos de respiración</span><div class="track"><div class="f m" style="width:2%"></div></div><span>0.00</span></div>
    <div class="br"><span>Razón de huecos de respiración</span><div class="track"><div class="f m" style="width:2%"></div></div><span>0.00</span></div>
    <div class="br"><span>Jitter de tono (val)</span><div class="track"><div class="f m" style="width:1%"></div></div><span>0.01</span></div>

    <div class="br"><span>Entrainment</span><div class="track"><div class="f m" style="width:11%"></div></div><span>0.18</span></div>
  </div>
  <p class="src">|d en val| · la telefonía a 8 kHz esconde la inhalación y el sangrado de habitación</p>
</figure>

<figure class="fig">
  <h2>Quedarnos vs tirar (68 rasgos)</h2>
  <div class="dots">
    <span class="dot keep">rms_cv</span>
    <span class="dot keep">zcr_std</span>
    <span class="dot keep">crest_cv</span>
    <span class="dot keep">flatness_std</span>
    <span class="dot keep">centroid_std</span>
    <span class="dot keep">pos_median wait</span>
    <span class="dot keep">agent_talk</span>
    <span class="dot keep">recovery_cv</span>
    <span class="dot drop">rms_mean</span>
    <span class="dot drop">breath</span>

    <span class="dot drop">entropía de pausa</span>
    <span class="dot drop">Whisper en vivo</span>
  </div>
  <p class="src">Ocho en producción. El resto se midió y se dejó en el piso.</p>
</figure>

<figure class="fig wide" id="model">
  <h2>Escalera de acierto en val</h2>
  <div class="bars">
    <div class="br"><span>Solo acústica</span><div class="track"><div class="f m" style="width:87.3%"></div></div><span>87.3%</span></div>
    <div class="br"><span>Solo conductual</span><div class="track"><div class="f m" style="width:93%"></div></div><span>93.0%</span></div>

</figure>

<figure class="fig">
  <h2>AUC en val por cabeza</h2>
  <div class="bars">
    <div class="br"><span>Acústica</span><div class="track"><div class="f a" style="width:96.3%"></div></div><span>0.963</span></div>
    <div class="br"><span>Conductual</span><div class="track"><div class="f a" style="width:97.9%"></div></div><span>0.979</span></div>
    <div class="br"><span>Stacked</span><div class="track"><div class="f h" style="width:99.7%"></div></div><span>0.997</span></div>
  </div>

</figure>

<figure class="fig">
  <h2>Pesos del mezclador</h2>
  <div class="bars">
    <div class="br"><span>Conductual</span><div class="track"><div class="f s" style="width:100%"></div></div><span>2.41</span></div>
    <div class="br"><span>Acústica</span><div class="track"><div class="f a" style="width:68%"></div></div><span>1.65</span></div>
  </div>

</figure>

<figure class="fig">
  <h2>Train vs val vs todo</h2>
  <div class="bars">
    <div class="br"><span>Val 71</span><div class="track"><div class="f h" style="width:97.2%"></div></div><span>97.2%</span></div>
    <div class="br"><span>Train 282</span><div class="track"><div class="f a" style="width:96.5%"></div></div><span>96.5%</span></div>

  </div>

</figure>

<figure class="fig">

  <div class="bars">
    <div class="br"><span>TPR sintético</span><div class="track"><div class="f s" style="width:98%"></div></div><span>98.0%</span></div>

<figure class="fig">

<figure class="fig" id="errors">
  <h2>Override de desacuerdo en val</h2>
  <div class="bars">
    <div class="br"><span>Desacuerdos</span><div class="track"><div class="f m" style="width:100%"></div></div><span>10</span></div>
    <div class="br"><span>Mezclador ya bien</span><div class="track"><div class="f a" style="width:80%"></div></div><span>8</span></div>

</figure>

<figure class="fig">
  <h2>Tipos de fallo en el set completo</h2>
  <div class="bars">
    <div class="br"><span>Correctas</span><div class="track"><div class="f h" style="width:96.6%"></div></div><span>341</span></div>
    <div class="br"><span>Mezclador eligió cabeza mal</span><div class="track"><div class="f s" style="width:2%"></div></div><span>7</span></div>
    <div class="br"><span>Las dos cabezas mal</span><div class="track"><div class="f m" style="width:1.4%"></div></div><span>5</span></div>
  </div>
  <p class="src">60 desacuerdos; el mezclador igual acierta 53. Un rasgo nuevo solo ayuda a los 5 fallos en que coinciden.</p>
