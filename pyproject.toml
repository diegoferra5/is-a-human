[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "is-a-human"
version = "0.1.0"
description = "Human vs synthetic caller detection for telephony audio"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "numpy>=1.26.0",
    "soundfile>=0.12.0",
    "pydantic>=2.0.0",
    "silero-vad>=5.1.0",
    "torch>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
is-a-human-eval = "is_a_human.eval.cli:main"
is-a-human-vad-benchmark = "is_a_human.eval.vad_cli:main"
is-a-human-benchmark = "is_a_human.eval.benchmark_cli:main"
is-a-human-train = "is_a_human.detect.cli:main"
is-a-human-explore = "is_a_human.analysis.cli:main"
is-a-human-serve = "is_a_human.api.cli:main"
is-a-human-latency = "is_a_human.eval.latency_compare:main"
is-a-human-inspect = "is_a_human.eval.inspect_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: tests that load real audio and run VAD (slower)",
    "vad: voice activity detection",
    "acoustic: caller-channel acoustic features",
    "semantic: transcript probe features",
    "behavioral: turn-timing and recovery behaviour",
]
